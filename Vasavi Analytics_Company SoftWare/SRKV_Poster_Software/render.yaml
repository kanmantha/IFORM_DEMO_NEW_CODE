services:
  - type: web
    name: srkv-poster-software
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: UseSqlite
        value: "true"
      - key: Jwt__SigningKey
        value: "SRKV-Render-Deploy-Poster-2026-Change-Me-At-Later"
      - key: SaaS__AdminEmail
        value: "admin@srkv.ac.in"
      - key: SaaS__AdminPassword
        value: "Admin@12345"
    disk:
      name: poster-data
      mountPath: /app/data
      sizeGB: 1
