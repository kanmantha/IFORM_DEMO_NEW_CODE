name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore IFORM.slnx

      - name: Build
        run: dotnet build IFORM.slnx -c Release --no-restore

      - name: Test
        run: dotnet test IFORM.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Publish web
        run: dotnet publish src/IForm.Web/IForm.Web.csproj -c Release -o ./artifacts/publish /p:UseAppHost=false

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: ./artifacts/publish
          if-no-files-found: error
